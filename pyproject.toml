[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bionet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
dashboard = ["rich>=13"]
dev = ["rich>=13", "pytest>=8", "matplotlib>=3.8"]
[tool.setuptools.packages.find]
include = ["bionet*"]
[tool.pytest.ini_options]
pythonpath = ["."]
